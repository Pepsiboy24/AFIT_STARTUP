<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar Content Injection (Suppressed for focused login task) -->
<header class="w-full flex justify-between items-center px-margin-mobile md:px-margin-desktop py-stack-md bg-transparent absolute top-0 z-10">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-headline-md" data-icon="school">school</span>
<span class="text-headline-sm font-headline-sm font-bold text-primary">Academic Abodes</span>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow flex items-center justify-center px-margin-mobile relative overflow-hidden">
<!-- Subtle Ambient Background Element -->
<div class="absolute top-0 right-0 -translate-y-1/2 translate-x-1/4 w-[600px] h-[600px] bg-primary-container/5 rounded-full blur-[100px] pointer-events-none"></div>
<div class="absolute bottom-0 left-0 translate-y-1/2 -translate-x-1/4 w-[600px] h-[600px] bg-secondary-container/10 rounded-full blur-[100px] pointer-events-none"></div>
<div class="w-full max-w-md z-10">
<div class="login-card bg-surface-container-lowest rounded-xl p-stack-lg flex flex-col gap-stack-md">
<!-- Header Section -->
<div class="text-center md:text-left">
<h1 class="text-headline-lg-mobile md:text-headline-lg font-headline-lg text-primary mb-2">Welcome Back</h1>
<p class="text-body-md font-body-md text-on-surface-variant">Access your secure student housing dashboard.</p>
</div>
<!-- Form Section -->
<form class="flex flex-col gap-stack-md" onsubmit="return false">
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="text-label-md font-label-md text-on-surface" for="email">University Email</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors" data-icon="mail">mail</span>
<input class="w-full h-[48px] pl-12 pr-4 bg-surface-container-low border border-outline-variant rounded-xl text-body-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-outline" id="email" placeholder="name@university.edu" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="text-label-md font-label-md text-on-surface" for="password">Password</label>
<a class="text-label-md font-label-md text-primary hover:underline transition-all" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors" data-icon="lock">lock</span>
<input class="w-full h-[48px] pl-12 pr-12 bg-surface-container-low border border-outline-variant rounded-xl text-body-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-outline" id="password" placeholder="Enter your password" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- CTA Button -->
<button class="w-full h-[56px] bg-primary text-on-primary rounded-xl font-label-md text-body-lg hover:bg-primary-container active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-4 shadow-md">
                        Login to Portal
                        <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center gap-4 py-2">
<div class="h-[1px] flex-grow bg-outline-variant"></div>
<span class="text-label-sm font-label-sm text-outline uppercase tracking-widest">or</span>
<div class="h-[1px] flex-grow bg-outline-variant"></div>
</div>
<!-- Secondary Actions -->
<div class="text-center">
<p class="text-body-sm font-body-sm text-on-surface-variant">
                        Don't have an account yet? 
                        <a class="text-primary font-bold hover:underline ml-1" href="#">Create Account</a>
</p>
</div>
</div>
<!-- Footer Meta -->
<div class="mt-stack-md flex flex-wrap justify-center gap-stack-md px-4">
<div class="flex items-center gap-2 text-outline">
<span class="material-symbols-outlined text-[18px]" data-icon="verified_user">verified_user</span>

</div>
<div class="flex items-center gap-2 text-outline">
<span class="material-symbols-outlined text-[18px]" data-icon="help_outline">help_outline</span>

</div>

</div>

</footer>
<script>
        // Micro-interaction for password toggle
        const toggleBtn = document.querySelector('button[type="button"]');
        const passInput = document.querySelector('#password');
        
        toggleBtn.addEventListener('click', () => {
            const isPass = passInput.type === 'password';
            passInput.type = isPass ? 'text' : 'password';
            toggleBtn.querySelector('span').textContent = isPass ? 'visibility_off' : 'visibility';
        });

        // Simple button interaction
        const loginBtn = document.querySelector('button.bg-primary');
        loginBtn.addEventListener('click', () => {
            loginBtn.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Authenticating...
            `;
            setTimeout(() => {
                loginBtn.innerHTML = `Login to Portal <span class="material-symbols-outlined">arrow_forward</span>`;
            }, 2000);
        });
    </script>
